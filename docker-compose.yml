services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshcase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshcase}
      POSTGRES_DB: ${POSTGRES_DB:-freshcase}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshcase} -d ${POSTGRES_DB:-freshcase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4.5}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      ENGINE_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  db_data:
