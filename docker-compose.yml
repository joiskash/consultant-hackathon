services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    # Passed through from the shell environment or the root .env file.
    # Left unset (rather than empty) when absent, so server.py defaults apply.
    environment:
      - ANTHROPIC_API_KEY
      - MODEL_NAME
      - SYSTEM_PROMPT
    volumes:
      # Research results written by /listen persist on the host.
      - ./DB:/app/DB
