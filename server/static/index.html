<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FreshCase — Topic Research</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 780px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        line-height: 1.55;
      }
      h1 { margin-bottom: 0.25rem; }
      p.sub { margin-top: 0; opacity: 0.7; }
      textarea {
        width: 100%;
        min-height: 140px;
        padding: 0.75rem;
        font: inherit;
        border: 1px solid #8884;
        border-radius: 8px;
        resize: vertical;
        box-sizing: border-box;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.6rem 1.2rem;
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: progress; }
      #status { margin-top: 1rem; min-height: 1.4em; }
      #status.error { color: #dc2626; }
      #reply {
        white-space: pre-wrap;
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #8884;
        border-radius: 8px;
      }
      #sources { margin-top: 1.25rem; padding-left: 1.1rem; }
      #sources li { margin-bottom: 0.4rem; }
      .hidden { display: none; }
      footer { margin-top: 2rem; font-size: 0.85rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>FreshCase</h1>
    <p class="sub">Enter a topic you're preparing for. We search the web for live updates, case studies, and question banks.</p>

    <form id="form">
      <textarea
        id="topic"
        placeholder="e.g. EV charging infrastructure market entry in India — need recent industry updates, case studies, and practice questions"
        required
      ></textarea>
      <button id="submit" type="submit">Research topic</button>
    </form>

    <div id="status"></div>

    <div id="reply" class="hidden"></div>

    <div id="sources-wrap" class="hidden">
      <h2>Sources</h2>
      <ul id="sources"></ul>
    </div>

    <footer id="dbfile"></footer>

    <script>
      const form = document.getElementById("form");
      const topic = document.getElementById("topic");
      const submit = document.getElementById("submit");
      const statusEl = document.getElementById("status");
      const replyEl = document.getElementById("reply");
      const sourcesWrap = document.getElementById("sources-wrap");
      const sourcesEl = document.getElementById("sources");
      const dbFileEl = document.getElementById("dbfile");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = topic.value.trim();
        if (!text) return;

        submit.disabled = true;
        statusEl.className = "";
        statusEl.textContent = "Searching…";
        replyEl.classList.add("hidden");
        sourcesWrap.classList.add("hidden");
        sourcesEl.innerHTML = "";
        dbFileEl.textContent = "";

        try {
          const response = await fetch("/listen", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(
              typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)
            );
          }

          statusEl.textContent = "";
          replyEl.textContent = data.reply;
          replyEl.classList.remove("hidden");

          if (data.sources?.length) {
            for (const source of data.sources) {
              const li = document.createElement("li");
              const a = document.createElement("a");
              a.href = source.url;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = source.title || source.url;
              li.append(a);
              sourcesEl.append(li);
            }
            sourcesWrap.classList.remove("hidden");
          }
          if (data.db_file) dbFileEl.textContent = `Saved to ${data.db_file}`;
        } catch (error) {
          statusEl.className = "error";
          statusEl.textContent = `Error: ${error.message}`;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
