name: Probe Parse.bot API

# Runs when the probe script changes, and on demand. Parse.bot fetches from its
# own infrastructure, so this does not touch AMC directly and cannot contribute
# to the edge block on our IPs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/probe-parsebot.js', 'src/parsebot.js', 'src/discover.js', '.github/workflows/probe-parsebot.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        env:
          PARSEBOT_API_KEY: ${{ secrets.PARSE_BOT || secrets.PARSEBOT_API_KEY }}
          PARSEBOT_SCRAPER_ID: ${{ vars.PARSEBOT_SCRAPER_ID }}
        run: |
          if [ -z "$PARSEBOT_API_KEY" ]; then
            echo "No Parse.bot key found. Add a repository secret named PARSE_BOT (or PARSEBOT_API_KEY)."; exit 1
          fi
          npm run probe:parsebot

      - name: Discover Odyssey formats across the watch window
        if: always()
        env:
          PARSE_BOT: ${{ secrets.PARSE_BOT }}
          PARSEBOT_SCRAPER_ID: ${{ vars.PARSEBOT_SCRAPER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run discover
