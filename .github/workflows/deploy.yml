name: Deploy to Fly.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'Dockerfile', 'fly.toml', 'package.json', '.github/workflows/deploy.yml']

env:
  FLY_APP: ${{ vars.FLY_APP || 'odyssey-watch-joiskash' }}
  FLY_REGION: ${{ vars.FLY_REGION || 'ewr' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      # Prove the vendor key and Telegram delivery BEFORE touching Fly. Deploying
      # a config that cannot reach AMC just produces a machine that looks healthy
      # and watches nothing.
      # Runs first and never blocks: if the key is refused, this is the log that
      # says which endpoints and header forms AMC actually accepts.
      - name: Probe AMC endpoints
        continue-on-error: true
        env:
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
        run: npm run probe

      - name: Validate config (AMC key + Telegram)
        env:
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check

      - name: Discover AMC format strings
        if: always()
        continue-on-error: true
        env:
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORMAT_PATTERN: ${{ vars.FORMAT_PATTERN }}
        run: npm run discover

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if missing
        run: |
          if flyctl apps list | grep -qw "$FLY_APP"; then
            echo "app $FLY_APP already exists"
          else
            flyctl apps create "$FLY_APP"
          fi

      - name: Create state volume if missing
        run: |
          if flyctl volumes list -a "$FLY_APP" | grep -q odyssey_state; then
            echo "volume already exists"
          else
            flyctl volumes create odyssey_state --size 1 --region "$FLY_REGION" -a "$FLY_APP" --yes
          fi

      - name: Push secrets to Fly
        run: |
          flyctl secrets set -a "$FLY_APP" --stage \
            AMC_VENDOR_KEY="${{ secrets.AMC_VENDOR_KEY }}" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"

      # --ha=false is essential: Fly's default of two machines would run two
      # watchers, double-alerting and doubling load on the vendor key.
      - name: Deploy
        run: flyctl deploy -a "$FLY_APP" --ha=false --remote-only

      - name: Status
        if: always()
        run: |
          flyctl status -a "$FLY_APP" || true
          echo "--- recent logs ---"
          timeout 30 flyctl logs -a "$FLY_APP" --no-tail || true
