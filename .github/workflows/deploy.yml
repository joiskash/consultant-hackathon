name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      validate_amc:
        description: 'Contact AMC to validate the key before deploying'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['src/**', 'Dockerfile', 'fly.toml', 'package.json', '.github/workflows/deploy.yml']

env:
  FLY_APP: ${{ vars.FLY_APP || 'odyssey-watch-joiskash' }}
  FLY_REGION: ${{ vars.FLY_REGION || 'ewr' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      # Safe to run on every deploy: Parse.bot fetches from its own
      # infrastructure, so this never touches AMC directly.
      - name: Validate config (source + Telegram)
        env:
          PARSE_BOT: ${{ secrets.PARSE_BOT }}
          PARSEBOT_SCRAPER_ID: ${{ vars.PARSEBOT_SCRAPER_ID }}
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if missing
        run: |
          if flyctl apps list | grep -qw "$FLY_APP"; then
            echo "app $FLY_APP already exists"
          else
            flyctl apps create "$FLY_APP"
          fi

      - name: Create state volume if missing
        run: |
          if flyctl volumes list -a "$FLY_APP" | grep -q odyssey_state; then
            echo "volume already exists"
          else
            flyctl volumes create odyssey_state --size 1 --region "$FLY_REGION" -a "$FLY_APP" --yes
          fi

      - name: Push secrets to Fly
        run: |
          flyctl secrets set -a "$FLY_APP" --stage \
            PARSE_BOT="${{ secrets.PARSE_BOT }}" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"

      # --ha=false is essential: Fly's default of two machines would run two
      # watchers, double-alerting and doubling load on the vendor key.
      - name: Deploy
        run: flyctl deploy -a "$FLY_APP" --ha=false --remote-only

      # A deploy that returns success while the process crash-loops is exactly
      # the "looks healthy, watches nothing" failure this project exists to
      # avoid. `flyctl logs --no-tail` replays a history buffer, so old failures
      # would otherwise be read as current ones: filter to this deploy's window
      # and treat machine state as the authoritative signal.
      - name: Verify the watcher is alive
        run: |
          echo "waiting for boot and a first poll..."
          sleep 60

          if ! flyctl status -a "$FLY_APP" | grep -qi started; then
            echo "no started machine; attempting a restart"
            flyctl machine restart -a "$FLY_APP" --skip-health-checks || true
            sleep 45
          fi

          flyctl status -a "$FLY_APP"

          CUTOFF=$(date -u -d '4 minutes ago' +%Y-%m-%dT%H:%M:%S)
          RECENT=$(timeout 45 flyctl logs -a "$FLY_APP" --no-tail 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | awk -v c="$CUTOFF" '{ if (match($0, /[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}/)) { ts=substr($0, RSTART, RLENGTH); if (ts >= c) print } }')

          echo "--- logs since $CUTOFF ---"
          echo "$RECENT"

          if ! flyctl status -a "$FLY_APP" | grep -qi started; then
            echo "::error::no machine in started state"; exit 1
          fi
          if echo "$RECENT" | grep -qE "startup failed|fatal:|max restart count"; then
            echo "::error::watcher is failing on this deploy"; exit 1
          fi
          if echo "$RECENT" | grep -q "candidate showtime"; then
            echo "CONFIRMED: the poller completed a cycle"
          else
            echo "::warning::machine is started but no poll line seen yet"
          fi
